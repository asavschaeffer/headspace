<div id="app">
  <header id="bar">
    <div class="wordmark"><span class="wm-dot"></span>substrate <span class="wm-sub">· syscall(1)</span></div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="select…" spellcheck="false" aria-label="select chunks" />
      <span class="search-hint" id="searchHint"></span>
    </div>
    <button id="themeBtn" class="ghost" title="theme" aria-label="toggle theme">◐</button>
  </header>

  <main id="stage">
    <section id="docCol" class="col"><div id="doc"></div></section>
    <aside id="rail" class="col">
      <div id="manifestCard" hidden></div>
      <div id="inspector">
        <ul class="legend">
          <li><span class="lg identity"></span><b>identity</b> — minted once, never changes</li>
          <li><span class="lg content"></span><b>content</b> — versioned, hashed</li>
          <li><span class="lg view"></span><b>view</b> — you can move it</li>
          <li><span class="lg prov"></span><b>provenance</b> — who touched it</li>
        </ul>
      </div>
      <div id="forkPanel" hidden></div>
    </aside>
  </main>

  <footer id="foot"><span id="hearth"></span></footer>
</div>

<style>
  :root{
    --paper:#FAF8F3; --fg:#241F19; --fg-soft:#5A5348;
    --accent:#0D9488; --human:#B45309; --model:#6D28D9;
    --rail-1: color-mix(in oklab, var(--fg) 13%, transparent);
    --rail-3: color-mix(in oklab, var(--fg) 4%, transparent);
    --chip-bg: color-mix(in oklab, var(--fg) 6%, transparent);
    --panel: color-mix(in oklab, var(--paper) 88%, var(--fg));
    --hairline: color-mix(in oklab, var(--fg) 11%, transparent);
    --serif:"Charter","Iowan Old Style","Palatino Linotype","Palatino",Georgia,serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#121418; --fg:#EAE7E0; --fg-soft:#9A948A;
      --accent:#2DD4BF; --human:#FBBF24; --model:#A78BFA;
      --panel: color-mix(in oklab, var(--paper) 82%, #fff);
      --hairline: color-mix(in oklab, var(--fg) 15%, transparent); }
  }
  :root[data-theme="light"]{ --paper:#FAF8F3; --fg:#241F19; --fg-soft:#5A5348; --accent:#0D9488; --human:#B45309; --model:#6D28D9;
    --panel: color-mix(in oklab, var(--paper) 88%, var(--fg)); --hairline: color-mix(in oklab, var(--fg) 11%, transparent); }
  :root[data-theme="dark"]{ --paper:#121418; --fg:#EAE7E0; --fg-soft:#9A948A; --accent:#2DD4BF; --human:#FBBF24; --model:#A78BFA;
    --panel: color-mix(in oklab, var(--paper) 82%, #fff); --hairline: color-mix(in oklab, var(--fg) 15%, transparent); }

  *{ box-sizing:border-box; }
  #app{ background:var(--paper); color:var(--fg); font-family:var(--serif); min-height:100vh; display:flex; flex-direction:column;
    animation:wake .5s ease; }
  @keyframes wake{ from{ opacity:0 } }

  #bar{ display:flex; align-items:center; gap:20px; height:52px; padding:0 20px; border-bottom:1px solid var(--hairline);
    position:sticky; top:0; z-index:20; background:color-mix(in oklab, var(--paper) 86%, transparent); backdrop-filter:blur(8px); }
  .wordmark{ font-family:var(--mono); font-size:13px; color:var(--fg); display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .wm-sub{ color:var(--fg-soft); }
  .wm-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%, transparent); }
  .wm-dot.beat{ animation:wmbeat 1s ease; }
  @keyframes wmbeat{ 0%,100%{ background:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%, transparent); }
    35%{ background:var(--model); box-shadow:0 0 0 6px color-mix(in oklab,var(--model) 30%, transparent); } }
  .search-wrap{ flex:1; display:flex; justify-content:center; align-items:center; gap:12px; position:relative; }
  #search{ width:min(360px,55vw); font-family:var(--mono); font-size:13px; color:var(--fg); background:var(--chip-bg);
    border:1px solid var(--hairline); border-radius:9px; padding:8px 13px; outline:none; transition:border-color .15s, box-shadow .15s; }
  #search:focus{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%, transparent); }
  #search::placeholder{ color:var(--fg-soft); }
  .search-hint{ font-family:var(--mono); font-size:11px; color:var(--fg-soft); white-space:nowrap; min-width:90px; opacity:0; transition:opacity .2s; }
  .ghost{ font-family:var(--mono); background:none; border:1px solid var(--hairline); color:var(--fg-soft); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px; }
  .ghost:hover{ color:var(--fg); border-color:var(--accent); }

  #stage{ flex:1; display:grid; grid-template-columns:minmax(0,1fr) 340px; align-items:start; }
  #docCol{ padding:44px clamp(20px,5vw,72px); overflow:auto; }
  #doc{ max-width:70ch; margin:0 auto; }
  #rail{ border-left:1px solid var(--hairline); padding:26px 22px; position:sticky; top:52px; align-self:stretch;
    min-height:calc(100vh - 52px); background:color-mix(in oklab,var(--paper) 60%, var(--panel)); }

  .msg{ margin-bottom:34px; }
  .msg.arriving{ animation:msgIn .5s ease; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(6px) } }
  .byline{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-soft);
    margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .byline .who{ padding:2px 7px; border-radius:5px; }
  .byline.human .who{ color:var(--human); background:color-mix(in oklab,var(--human) 12%, transparent); }
  .byline.model .who{ color:var(--model); background:color-mix(in oklab,var(--model) 12%, transparent); }
  .byline .via{ text-transform:none; letter-spacing:0; color:var(--fg-soft); }

  .row{ position:relative; padding:3px 30px 3px 18px; margin:1px 0; border-radius:6px;
    transition:background .15s, opacity .25s, outline-color .12s; outline:1px solid transparent; cursor:default; }
  .row:hover{ outline-color:var(--rail-1); background:color-mix(in oklab,var(--fg) 3%, transparent); }
  .row.anc-lit{ outline-color:var(--rail-3); }
  .row.selected{ outline-color:var(--accent) !important; background:color-mix(in oklab,var(--accent) 7%, transparent); }
  .prose{ font-family:var(--serif); font-size:17px; line-height:1.5; color:var(--fg); }
  .heading .prose{ font-weight:600; font-size:15px; } .heading{ margin-top:20px; }
  .list{ list-style:none; padding:0; margin:2px 0 2px 4px; }
  .li .prose{ font-size:16px; } .li .prose .dashnote{ color:var(--fg-soft); }

  /* provenance spine */
  .row::before{ content:""; position:absolute; left:6px; top:5px; bottom:5px; width:2px; border-radius:2px;
    background:var(--sp,transparent); opacity:.34; transition:opacity .9s ease; }
  .row:hover::before, .row.selected::before{ opacity:.9; }
  .row.by-model{ --sp:var(--model); } .row.by-human{ --sp:var(--human); }
  .row.spine-hot::before{ opacity:1; }
  .row.welcome::before{ animation:welcomeGlow 2.6s ease; }
  @keyframes welcomeGlow{ 0%{opacity:.34} 18%{opacity:1} 100%{opacity:.34} }

  /* grip (VIEW) — dwell-delayed reveal: a home doesn't flinch when you pass */
  .grip{ position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:16px; height:20px; display:grid; place-items:center;
    cursor:grab; opacity:0; transition:opacity .15s ease .18s; color:var(--accent); }
  .li:hover .grip, .li.selected .grip{ opacity:.75; transition-delay:.18s; }
  .grip:hover{ opacity:1 !important; transition-delay:0s; } .grip svg{ width:9px; height:15px; }
  .comet{ position:absolute; left:-19px; top:50%; width:5px; height:5px; border-radius:50%; background:var(--accent);
    transform:translateY(-50%); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%, transparent); opacity:0; transition:opacity .3s; }
  .li.moved .comet{ opacity:1; }

  /* the ember (GENERATE affordance) — hollow violet ring = model, pre-provenance */
  .ember{ position:absolute; left:-17px; top:calc(50% + 13px); width:11px; height:11px; border-radius:50%;
    border:1.6px solid var(--model); background:transparent; cursor:pointer; opacity:0; transform:scale(.7);
    transition:opacity .18s ease .12s, transform .18s; }
  .row.selected .ember{ opacity:.9; transform:scale(1); }
  .ember:hover{ opacity:1; box-shadow:0 0 0 4px color-mix(in oklab,var(--model) 16%, transparent); }
  .ember .lbl{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:10px;
    color:var(--model); opacity:0; transition:opacity .15s; white-space:nowrap; }
  .ember:hover .lbl{ opacity:.9; }
  .ember.lit{ background:var(--model); border-color:var(--model); box-shadow:0 0 0 0 color-mix(in oklab,var(--model) 45%, transparent); }
  .ember.pulsing{ animation:lubdub 1s ease-in-out infinite; }
  @keyframes lubdub{
    0%{ box-shadow:0 0 0 0 color-mix(in oklab,var(--model) 45%, transparent); }
    9%{ box-shadow:0 0 0 9px color-mix(in oklab,var(--model) 0%, transparent); }
    18%{ box-shadow:0 0 0 0 color-mix(in oklab,var(--model) 45%, transparent); }
    27%{ box-shadow:0 0 0 9px color-mix(in oklab,var(--model) 0%, transparent); }
    36%,100%{ box-shadow:0 0 0 0 color-mix(in oklab,var(--model) 0%, transparent); } }

  /* the choice */
  .choice{ position:absolute; left:-2px; top:calc(100% + 2px); display:flex; gap:14px; font-family:var(--mono); font-size:11px; z-index:6;
    opacity:0; animation:fadeUp .35s ease forwards; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(3px) } to{ opacity:1; transform:none } }
  .choice button{ background:none; border:none; cursor:pointer; font-family:var(--mono); font-size:11px; padding:2px 4px; }
  .choice .cont{ color:var(--model); } .choice .frk{ color:var(--accent); } .choice .esc{ color:var(--fg-soft); }
  .choice button:hover{ text-decoration:underline; }

  .idchip{ position:absolute; right:6px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:10px; color:var(--fg-soft);
    opacity:0; transition:opacity .15s ease .18s; padding:1px 5px; border-radius:4px; background:var(--chip-bg); }
  .row:hover .idchip, .row.selected .idchip{ opacity:.85; transition-delay:.18s; }

  .row.dim{ opacity:.28; } .row.gathered{ outline-color:color-mix(in oklab,var(--model) 40%, transparent); background:color-mix(in oklab,var(--model) 5%, transparent); }
  .row.hit .prose{ background:color-mix(in oklab,var(--accent) 20%, transparent); border-radius:4px; box-decoration-break:clone; padding:0 2px; }
  .countchip{ font-family:var(--mono); font-size:10px; color:var(--accent); margin-left:8px; padding:1px 6px; border-radius:9px;
    background:color-mix(in oklab,var(--accent) 13%, transparent); display:none; }
  .heading.rollup .countchip{ display:inline-block; animation:pop .3s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ from{ transform:scale(.4); opacity:0 } }

  /* order toggle */
  .ordertoggle{ display:none; margin-left:10px; font-family:var(--mono); font-size:10px; border:1px solid var(--hairline); border-radius:7px; overflow:hidden; vertical-align:middle; }
  .heading.has-moves .ordertoggle{ display:inline-flex; }
  .ordertoggle button{ background:none; border:none; color:var(--fg-soft); padding:3px 8px; cursor:pointer; font-family:var(--mono); font-size:10px; }
  .ordertoggle button.on{ background:var(--accent); color:var(--paper); }
  .forkbtn{ display:none; margin-left:10px; font-family:var(--mono); font-size:10px; color:var(--accent);
    background:color-mix(in oklab,var(--accent) 12%, transparent); border:none; border-radius:7px; padding:2px 9px; cursor:pointer; vertical-align:middle; }
  .heading:hover .forkbtn, .heading.selected .forkbtn{ display:inline-block; }

  /* drag */
  .drag-ghost{ position:fixed; z-index:60; pointer-events:none; font-family:var(--serif); font-size:16px; background:var(--paper);
    border:1px solid var(--accent); border-radius:8px; padding:6px 14px; box-shadow:0 10px 28px color-mix(in oklab,var(--fg) 22%, transparent);
    transform:rotate(1.2deg) scale(1.02); display:flex; gap:8px; align-items:center; max-width:52ch; }
  .drag-ghost .mini{ font-family:var(--mono); font-size:9px; color:var(--fg-soft); }
  .row.lifting{ opacity:.32; }
  .insert-line{ position:absolute; height:2px; background:var(--accent); border-radius:2px; left:0; right:8px; box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%, transparent); pointer-events:none; }
  .insert-line::before{ content:""; position:absolute; left:-2px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent); }

  /* manifest — the context window, made readable */
  #manifestCard{ border:1px solid color-mix(in oklab,var(--model) 30%, var(--hairline)); border-radius:11px; padding:13px; margin-bottom:14px;
    background:color-mix(in oklab,var(--paper) 72%, var(--panel)); animation:fadeUp .3s ease; }
  #manifestCard h4{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 9px; color:var(--model); }
  #manifestCard .mid{ font-family:var(--mono); font-size:11px; color:var(--fg-soft); padding:1px 0; transition:opacity .4s; }
  #manifestCard .mid.spent{ opacity:.28; }
  #manifestCard .mfoot{ font-family:var(--mono); font-size:11px; color:var(--fg); margin-top:9px; padding-top:8px; border-top:1px solid var(--hairline); }
  .fly-chip{ position:fixed; z-index:55; font-family:var(--mono); font-size:10px; color:var(--model); background:var(--chip-bg); padding:1px 5px; border-radius:4px; pointer-events:none; }

  /* knitting: chunks arrive WHOLE, one at a time — the atom is the chunk, not the token */
  .knit-slot{ height:0; overflow:hidden; }
  .row.knitting{ }
  .row.knitting .prose{ opacity:0; transform:translateY(3px); }
  .row.knit-prose .prose{ opacity:1; transform:none; transition:opacity .3s ease, transform .3s ease; }

  /* inspector */
  .legend{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:11px; }
  .legend li{ font-family:var(--mono); font-size:11px; color:var(--fg-soft); display:flex; align-items:center; gap:9px; }
  .legend b{ color:var(--fg); font-weight:600; }
  .lg{ width:11px; height:11px; border-radius:3px; flex:none; }
  .lg.identity{ background:var(--fg-soft); } .lg.content{ background:var(--accent); } .lg.view{ border:2px solid var(--accent); }
  .lg.prov{ background:linear-gradient(var(--human),var(--model)); }
  .zone{ border:1px solid var(--hairline); border-radius:10px; padding:12px 13px; margin-bottom:11px; background:color-mix(in oklab,var(--paper) 70%, var(--panel)); }
  .zone h4{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 9px; color:var(--fg-soft); display:flex; justify-content:space-between; }
  .zone.z-view h4 .tag{ color:var(--accent); } .zone.z-prov h4 .tag{ color:var(--model); }
  .kv{ font-family:var(--mono); font-size:12px; display:flex; justify-content:space-between; gap:12px; padding:2px 0; }
  .kv .k{ color:var(--fg-soft); } .kv .v{ color:var(--fg); text-align:right; word-break:break-all; } .kv .v.accent{ color:var(--accent); }
  .prov-tick{ font-family:var(--mono); font-size:11px; display:flex; align-items:center; gap:8px; padding:3px 0; }
  .prov-tick .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .prov-tick.model .dot{ border:1.5px solid var(--model); } .prov-tick.human .dot{ background:var(--human); }
  .prov-tick .lbl{ color:var(--fg); } .prov-tick .when{ color:var(--fg-soft); margin-left:auto; }
  .ctx-ids{ font-family:var(--mono); font-size:10px; color:var(--fg-soft); margin-top:6px; line-height:1.5; word-break:break-all; }

  #forkPanel{ border-top:1px solid var(--hairline); margin-top:8px; padding-top:16px; }
  .fork-head{ font-family:var(--mono); font-size:11px; color:var(--fg-soft); margin-bottom:4px; }
  .fork-root{ font-family:var(--mono); font-size:12px; color:var(--accent); margin-bottom:12px; }
  .fork-tree .li .prose{ font-size:14px; } .fork-tree .heading .prose{ font-size:13px; }
  .lineage{ font-family:var(--mono); font-size:10px; color:var(--fg-soft); margin-top:10px; padding:8px 10px; border:1px dashed var(--hairline); border-radius:8px; }
  .lineage b{ color:var(--model); }
  .dimmed{ opacity:.6 !important; transition:opacity .5s; }

  #foot{ padding:11px 20px; border-top:1px solid var(--hairline); }
  #hearth{ font-family:var(--mono); font-size:11px; color:var(--fg-soft); }
  #hearth .up{ color:var(--model); transition:color .1s; }
  #hearth b{ color:var(--fg-soft); font-weight:400; }

  @media (max-width:860px){ #stage{ grid-template-columns:1fr; } #rail{ border-left:none; border-top:1px solid var(--hairline); position:static; min-height:0; } .search-hint{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>

<script>
(function(){
  "use strict";
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ══ substrate core (verified) ══════════════════════════════════════════
  function fnv1a(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return('0000000'+h.toString(16)).slice(-8); }
  let _seq=0; const nextSeq=()=>String(++_seq).padStart(6,'0'); const newId=(seq)=>`c_${seq.slice(-4)}_${Math.random().toString(36).slice(2,6)}`;
  function keyBetween(a,b){ const lo=a==null?0:parseFloat(a),hi=b==null?1:parseFloat(b); return String((lo+hi)/2); }
  function mk(o){ const seq=nextSeq(); return{ id:newId(seq),causal_seq:seq,kind:o.kind,text:o.text??null,content_hash:null,
    parent_id:o.parent_id??null,order_key:o.order_key??'0.5',origin:{actor:o.actor,at:o.at||Date.now(),source_id:o.source_id},derived_from:undefined,context:undefined,edits:[] }; }
  class Store{
    constructor(){ this.map=new Map(); } put(c){ this.map.set(c.id,c); return c; } get(id){ return this.map.get(id); } all(){ return[...this.map.values()]; }
    roots(){ return this.all().filter(c=>c.parent_id==null); }
    children(id,mode){ const k=this.all().filter(c=>c.parent_id===id);
      return mode==='causal'?k.sort((x,y)=>x.causal_seq.localeCompare(y.causal_seq)):k.sort((x,y)=>parseFloat(x.order_key)-parseFloat(y.order_key)); }
    ancestors(id){ const o=[]; let c=this.get(id); while(c&&c.parent_id!=null){ c=this.get(c.parent_id); if(c)o.push(c);} return o; }
    descendants(id){ const o=[]; const w=(p)=>this.children(p).forEach(k=>{o.push(k); w(k.id);}); w(id); return o; }
    hashOf(id){ const c=this.get(id),k=this.children(id); c.content_hash=k.length?fnv1a(c.kind+'|'+k.map(x=>this.hashOf(x.id)).join(',')):fnv1a(c.kind+'|'+(c.text??'')); return c.content_hash; }
    rehashAll(){ this.roots().forEach(r=>this.hashOf(r.id)); }
    rehashFrom(id){ let c=this.get(id); while(c){ this.hashOf(c.id); c=c.parent_id==null?null:this.get(c.parent_id);} }
  }
  function parse(md,store,meta){
    const root=store.put(mk({kind:'message',actor:meta.actor,source_id:meta.source_id,at:meta.at}));
    const lines=md.replace(/\r/g,'').split('\n'); const sec=[{depth:0,id:root.id}]; let cur=null; const cnt=new Map();
    const key=(p)=>{ const n=(cnt.get(p)??0)+1; cnt.set(p,n); return String(n/100); }; const top=()=>sec[sec.length-1].id;
    const add=(k,t,p)=>store.put(mk({kind:k,text:t,parent_id:p,order_key:key(p),actor:meta.actor,source_id:meta.source_id,at:meta.at}));
    for(let i=0;i<lines.length;i++){ const line=lines[i]; const h=/^(#{1,6})\s+(.*)$/.exec(line);
      if(h){ const d=h[1].length; while(sec.length>1&&sec[sec.length-1].depth>=d)sec.pop(); const s=add('heading_section',h[2].trim(),top()); sec.push({depth:d,id:s.id}); cur=null; continue; }
      const li=/^\s*[-*]\s+(.*)$/.exec(line); if(li){ if(!cur)cur=add('list',null,top()).id; add('list_item',li[1].trim(),cur); continue; }
      if(line.trim()===''){ cur=null; continue; } add('paragraph',line.trim(),top()); cur=null; }
    store.rehashAll(); return root.id;
  }
  function rearrange(store,id,parent,key){ const c=store.get(id),op=c.parent_id; c.parent_id=parent; c.order_key=key; store.rehashFrom(op??id); store.rehashFrom(parent??id); return c; }
  function fork(store,rootId,meta){ const copy=(src,par)=>{ const s=store.get(src),seq=nextSeq();
    const c={...JSON.parse(JSON.stringify(s)),id:newId(seq),causal_seq:seq,parent_id:par,order_key:s.order_key,origin:{actor:meta.actor,at:Date.now(),source_id:meta.source_id},derived_from:{id:s.id,op:'fork'},edits:[]};
    store.put(c); store.children(src).forEach(k=>copy(k.id,c.id)); return c.id; }; const r=copy(rootId,null); store.rehashFrom(r); return r; }
  function search(store,q){ q=q.toLowerCase().trim(); if(!q)return{leaves:[],parents:new Map()};
    const leaves=store.all().filter(c=>c.text!=null&&c.text.toLowerCase().includes(q)); const pc=new Map();

  // ══ THE HEARTBEAT — select · reduce · generate ═════════════════════════
  async function heartbeat(targetId){
    if(busy) return; busy=true;
    const doc=$('#doc'); const target=store.get(targetId); selectChunk(targetId);
    const targetRow=doc.querySelector(`.row[data-id="${targetId}"]`); const emberEl=targetRow.querySelector('.ember');

    // ── SELECT: gather ──────────────────────────────────────────────────
    const gathered=gather(store,targetId); const gset=new Set(gathered.map(c=>c.id));
    doc.querySelectorAll('.row').forEach(r=>{ if(!gset.has(r.dataset.id)) r.classList.add('dim'); else if(r.dataset.id!==targetId) r.classList.add('gathered'); });
    await sleep(reduced?0:750);

    // ── REDUCE: assemble a readable manifest ────────────────────────────
    const leafGathered=gathered.filter(c=>c.text!=null); const tokens=Math.round(leafGathered.map(c=>c.text).join(' ').length/4);
    const card=$('#manifestCard'); card.hidden=false; card.innerHTML='<h4>reduce · context manifest</h4>';
    const cardRect=card.getBoundingClientRect();
    for(const c of leafGathered){ const mid=el('div','mid'); mid.dataset.mid=c.id; mid.textContent=c.id+'  '+(c.text.length>26?c.text.slice(0,26)+'…':c.text); card.append(mid);
      if(!reduced){ const src=doc.querySelector(`.row[data-id="${c.id}"] .idchip`); if(src){ flyChip(src,card); await sleep(70); } } }
    const foot=el('div','mfoot'); foot.textContent=`${leafGathered.length} chunks · ~${tokens} tokens`; card.append(foot);
    await sleep(reduced?0:450);

    // ── CHOICE: continue ↵ / fork → ─────────────────────────────────────
    const mode=await new Promise((resolve)=>{
      const ch=el('div','choice'); ch.innerHTML='<button class="cont">continue ↵</button><button class="frk">fork →</button><button class="esc">esc</button>';
      targetRow.append(ch);
      const done=(m)=>{ ch.remove(); document.removeEventListener('keydown',onKey); resolve(m); };
      ch.querySelector('.cont').onclick=(e)=>{e.stopPropagation();done('continue');};
      ch.querySelector('.frk').onclick=(e)=>{e.stopPropagation();done('fork');};
      ch.querySelector('.esc').onclick=(e)=>{e.stopPropagation();done(null);};
      const onKey=(e)=>{ if(e.key==='Enter')done('continue'); else if(e.key==='Escape')done(null); };
      document.addEventListener('keydown',onKey);
      if(reduced) done('continue');
    });
    if(!mode){ // cancel — invocation reversible up to the last instant
      $('#manifestCard').hidden=true; doc.querySelectorAll('.row').forEach(r=>r.classList.remove('dim','gathered')); busy=false; return;
    }

    // ── GENERATE: the pulse ─────────────────────────────────────────────
    emberEl.classList.add('lit','pulsing');
    if(!firstBeatDone){ $('.wm-dot').classList.add('beat'); firstBeatDone=true; }
    await sleep(reduced?0:2400);
    emberEl.classList.remove('pulsing');

    // build the reply as real chunks, threaded into the tree
    const seed=seedFor(target.text); const md=`## ${seed.heading}\n`+seed.bullets.map(b=>'- '+b).join('\n');
    const replyRoot=parse(md,store,{actor:{model:seed.model},source_id:`gen:${targetId}`,at:Date.now()});
    const rr=store.get(replyRoot); rr.derived_from={id:targetId,op:mode==='fork'?'fork':'generate'}; rr.context=gathered.map(c=>c.id); store.rehashFrom(replyRoot);

    // ── ARRIVAL: knit whole chunks in, one at a time ────────────────────
    if(mode==='fork'){ // land as a new tree in the rail
      const panel=$('#forkPanel'); panel.hidden=false; panel.innerHTML='';
      const head=el('div','fork-head'); head.textContent='forked · generated branch'; const rl=el('div','fork-root'); rl.textContent='root  '+replyRoot; panel.append(head,rl);
      const tree=el('div','fork-tree'); panel.append(tree);
      const hr=el('div','row heading by-model'); hr.style.setProperty('--sp','var(--model)'); hr.append(renderProse(seed.heading)); tree.append(hr);
      for(const b of seed.bullets){ const r=el('div','row li by-model'); r.style.setProperty('--sp','var(--model)'); r.append(renderProse(b)); tree.append(r); await knitReveal(r); }
      const lin=el('div','lineage'); lin.innerHTML=`copy-on-write · <b>derived_from</b> ${targetId} · via ${gathered.length} chunks`; panel.append(lin);
    } else { // continue — thread a new model message below
      const msg=el('article','msg arriving'); msg.dataset.msg=replyRoot;
      const bl=el('div','byline model'); const who=el('span','who'); who.textContent='claude'; bl.append(who); const via=el('span','via'); via.textContent=' · '+seed.model+' · via '+targetId; bl.append(via); msg.append(bl);
      $('#doc').append(msg); msgOrder.push(replyRoot);
      const heads=store.children(replyRoot); // heading_section
      for(const h of heads){ const hr=el('div','row heading by-model'); hr.dataset.id=h.id; hr.style.setProperty('--sp','var(--model)'); hr.append(renderProse(h.text),idChip(h)); wireRow(hr,h); msg.append(hr); await knitReveal(hr);
        const listC=store.children(h.id).find(x=>x.kind==='list'); const holder=el('div');
        if(listC){ const ul=el('div','list'); holder.append(ul); msg.append(holder);

            r.append(renderProse(li.text),idChip(li)); wireRow(r,li); ul.append(r); await knitReveal(r); } } }
    }

    // ── EXHALE ──────────────────────────────────────────────────────────
    emberEl.classList.remove('lit');
    setTimeout(()=>{ $('#manifestCard').hidden=true; },300);
    doc.querySelectorAll('.row').forEach(r=>r.classList.remove('dim','gathered'));

  }
  function flyChip(srcEl,card){ const s=srcEl.getBoundingClientRect(),c=card.getBoundingClientRect();

  async function knitReveal(row){ // slot opens -> spine lands -> prose settles; WHOLE chunk, never streamed

  // ══ hearth · theme · welcome ═══════════════════════════════════════════
  function updateHearth(){ const leaves=store.all().filter(c=>c.text!=null);
    const human=leaves.filter(c=>c.origin.actor.kind==='human'||!c.origin.actor.model).length;
    const model=leaves.filter(c=>c.origin.actor.model).length; const last=Math.max(...store.all().map(c=>c.origin.at));
    $('#hearth').innerHTML=`${leaves.length} chunks · ${human} human · <span class="up">${model} model</span> · <b>last written ${rel(last)}</b>`; }
  $('#themeBtn').onclick=()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.setAttribute('data-theme',cur==='dark'?'light':'dark'); };
  $('#search').addEventListener('input',(e)=>applySearch(e.target.value));

  renderAll();
  setInterval(updateHearth,60000);
  // welcome-back: the house remembers where you left off — last human touch warms, then cools
  setTimeout(()=>{ const last=$('#doc').querySelector('.msg[data-msg="'+uRoot+'"] .row'); if(last&&!reduced) last.classList.add('welcome'); },500);
})();
</script>
