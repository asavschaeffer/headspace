<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain - Living Memory Galaxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #ddd;
            font-family: 'Monaco', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
            user-select: none;
        }

        #galaxy-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                        rgba(10, 0, 30, 0.4) 0%,
                        rgba(0, 0, 10, 0.8) 40%,
                        rgba(0, 0, 0, 1) 100%);
            cursor: crosshair;
        }

        #galaxy-canvas.over-node {
            cursor: pointer;
        }

        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: rgba(200, 200, 200, 0.5);
            text-align: right;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(100, 150, 255, 0.3);
        }

        #search-box {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.2);
            display: none;
            z-index: 1500;
            min-width: 400px;
        }

        #search-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        #search-input::placeholder {
            color: rgba(150, 150, 200, 0.5);
        }

        #search-results-list {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .search-result-item {
            padding: 8px;
            margin: 2px 0;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .search-result-item:hover,
        .search-result-item.selected {
            background: rgba(100, 150, 255, 0.1);
            border-left-color: rgba(150, 180, 255, 0.5);
        }

        .search-result-item .filename {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .search-result-item .match {
            color: rgba(180, 180, 200, 0.6);
            font-size: 12px;
            margin-top: 4px;
        }

        .search-hints {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
            font-size: 11px;
            color: rgba(150, 150, 200, 0.4);
        }

        #inline-input {
            position: absolute;
            display: none;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid rgba(150, 180, 255, 0.3);
            border-radius: 4px;
            padding: 8px;
            min-width: 300px;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.4);
            z-index: 1000;
        }

        #inline-input textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 60px;
            max-height: 200px;
        }

        #inline-input .hint {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(180, 180, 200, 0.5);
            border-top: 1px solid rgba(150, 180, 255, 0.15);
            padding-top: 6px;
        }

        #file-viewer {
            position: absolute;
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            height: 70%;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid rgba(150, 180, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.3);
            z-index: 2000;
        }

        #file-viewer .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(150, 180, 255, 0.2);
        }

        #file-viewer .title {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        #file-viewer .close {
            cursor: pointer;
            color: rgba(200, 200, 200, 0.5);
            font-size: 20px;
            padding: 0 5px;
            transition: color 0.2s;
        }

        #file-viewer .close:hover {
            color: #fff;
        }

        #file-viewer .content {
            height: calc(100% - 50px);
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(220, 220, 220, 0.9);
        }

        #file-viewer .content::-webkit-scrollbar {
            width: 8px;
        }

        #file-viewer .content::-webkit-scrollbar-track {
            background: rgba(100, 150, 255, 0.1);
        }

        #file-viewer .content::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.3);
            border-radius: 4px;
        }

        #context-menu,
        #background-context-menu {
            position: absolute;
            display: none;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid rgba(150, 180, 255, 0.3);
            border-radius: 4px;
            padding: 4px 0;
            backdrop-filter: blur(10px);
            z-index: 3000;
            min-width: 150px;
        }

        #context-menu .menu-item,
        #background-context-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            color: rgba(200, 200, 200, 0.8);
            font-size: 13px;
            transition: all 0.2s;
        }

        #context-menu .menu-item:hover,
        #background-context-menu .menu-item:hover {
            background: rgba(100, 150, 255, 0.15);
            color: #fff;
        }

        #context-menu .separator {
            height: 1px;
            background: rgba(150, 180, 255, 0.15);
            margin: 4px 0;
        }

        .breathing {
            animation: breathe 30s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        .ripple {
            position: absolute;
            border: 1px solid rgba(150, 180, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple-expand 2s ease-out forwards;
        }

        @keyframes ripple-expand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        #help-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(150, 150, 200, 0.4);
            pointer-events: none;
            text-align: center;
            transition: opacity 2s;
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas" class="breathing"></canvas>

    <div id="status">
        <div id="node-count">0 memories</div>
        <div id="connection-count">0 connections</div>
        <div id="last-action"></div>
    </div>

    <div id="search-box">
        <input type="text" id="search-input" placeholder="Search your universe..." />
        <div id="search-results-list"></div>
        <div class="search-hints">↑↓ Navigate • Enter Select • Esc Cancel</div>
    </div>

    <div id="help-hint">
        Click empty space to create • Click node to view • / to search • Drag to navigate
    </div>

    <div id="inline-input">
        <textarea placeholder="Type your thought..."></textarea>
        <div class="hint">Ctrl+Enter to save • Esc to cancel</div>
    </div>

    <div id="file-viewer">
        <div class="header">
            <div class="title"></div>
            <div class="close">×</div>
        </div>
        <div class="content"></div>
    </div>

    <div id="context-menu">
        <div class="menu-item" data-action="open">Open</div>
        <div class="menu-item" data-action="append">Add to this thought</div>
        <div class="separator"></div>
        <div class="menu-item" data-action="delete">Delete</div>
    </div>

    <div id="background-context-menu">
        <div class="menu-item" data-action="new-thought">New thought</div>
        <div class="menu-item" data-action="search">Search</div>
    </div>

    <script>
        // ============================================
        // GALAXY BRAIN - Cosmic Memory Visualization
        // ============================================

        class GalaxyBrain {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');

                this.nodes = new Map();
                this.edges = [];
                this.backgroundStars = [];

                // Viewport
                this.camera = { x: 0, y: 0, zoom: 1 };
                this.targetCamera = { x: 0, y: 0, zoom: 1 };

                // Mouse state
                this.mouse = { x: 0, y: 0, down: false, startX: 0, startY: 0 };
                this.hoveredNode = null;
                this.selectedNode = null;
                this.draggedNode = null;
                this.clickedEmpty = false;
                this.clickedEmptyPos = null;

                // Animation state
                this.frame = 0;
                this.breathingPhase = 0;
                this.globalGravity = 0.01;

                // Search state
                this.searchMode = false;
                this.searchResults = [];

                // Node physics settings
                this.settings = {
                    driftSpeed: 0.0001,
                    gravityStrength: 0.001,
                    repulsionStrength: 1000,
                    connectionAttraction: 0.01,
                    damping: 0.99,
                    breathingSpeed: 0.0002,
                    rippleSpeed: 2,
                    maxNodes: 500
                };

                this.setupEvents();
                this.resize();
                this.generateBackgroundStars();
                this.loadGraph();
                this.animate();

                this.firstInteraction = false;
            }

            generateBackgroundStars() {
                // Create static background stars for depth
                const count = 200;
                for (let i = 0; i < count; i++) {
                    this.backgroundStars.push({
                        x: Math.random() * 4000 - 2000,
                        y: Math.random() * 4000 - 2000,
                        size: Math.random() * 1.5,
                        brightness: Math.random() * 0.3 + 0.1
                    });
                }
            }

            setupEvents() {
                window.addEventListener('resize', () => this.resize());

                // Mouse events
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
                this.canvas.addEventListener('wheel', (e) => this.onWheel(e));
                this.canvas.addEventListener('dblclick', (e) => this.onDoubleClick(e));
                this.canvas.addEventListener('contextmenu', (e) => this.onRightClick(e));

                // Touch events
                this.canvas.addEventListener('touchstart', (e) => this.onTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.onTouchMove(e));
                this.canvas.addEventListener('touchend', (e) => this.onTouchEnd(e));

                // Keyboard events
                document.addEventListener('keydown', (e) => this.onKeyDown(e));

                // Prevent default context menu
                document.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            async loadGraph() {
                try {
                    const response = await fetch('/api/graph');
                    const data = await response.json();
                    this.updateGraph(data);
                } catch (error) {
                    console.error('Failed to load graph:', error);
                }

                setTimeout(() => this.loadGraph(), 5000);
            }

            updateGraph(data) {
                data.nodes.forEach(nodeData => {
                    if (!this.nodes.has(nodeData.id)) {
                        const node = {
                            ...nodeData,
                            x: (Math.random() - 0.5) * 1000,
                            y: (Math.random() - 0.5) * 1000,
                            z: (Math.random() - 0.5) * 100,
                            vx: (Math.random() - 0.5) * 0.1,
                            vy: (Math.random() - 0.5) * 0.1,
                            vz: 0,
                            radius: Math.sqrt(nodeData.size / 1024) * 3 + 3,
                            heat: 0,
                            pulse: 0,
                            searchAlpha: 1,
                            targetSearchAlpha: 1,
                            twinkle: Math.random()
                        };
                        this.nodes.set(nodeData.id, node);
                        this.createRipple(node.x, node.y);
                    } else {
                        const node = this.nodes.get(nodeData.id);
                        Object.assign(node, nodeData);
                    }
                });

                this.edges = data.edges.map(edge => ({
                    ...edge,
                    source: this.nodes.get(edge.source),
                    target: this.nodes.get(edge.target)
                })).filter(e => e.source && e.target);

                document.getElementById('node-count').textContent = `${this.nodes.size} memories`;
                document.getElementById('connection-count').textContent = `${this.edges.length} connections`;
            }

            createRipple(x, y) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';

                const screenX = (x - this.camera.x) * this.camera.zoom + this.canvas.width / 2;
                const screenY = (y - this.camera.y) * this.camera.zoom + this.canvas.height / 2;

                ripple.style.left = (screenX - 200) + 'px';
                ripple.style.top = (screenY - 200) + 'px';
                document.body.appendChild(ripple);

                setTimeout(() => ripple.remove(), 2000);
            }

            getNodeTemperature(node) {
                // Return color based on node age and activity
                const age = node.age || 0;
                const heat = node.heat || 0;

                if (heat > 0.5 || age < 1) return 'hot';      // Blue-white
                if (age < 7) return 'warm';                    // Yellow-white
                if (age < 30) return 'cool';                   // Orange-white
                return 'cold';                                  // Red-white
            }

            updatePhysics() {
                const dt = 1;
                this.breathingPhase += this.settings.breathingSpeed;
                this.globalGravity = 0.01 * (1 + Math.sin(this.breathingPhase) * 0.05);

                this.nodes.forEach(node => {
                    if (node === this.draggedNode) return;

                    let fx = 0, fy = 0, fz = 0;

                    fx += (Math.random() - 0.5) * this.settings.driftSpeed;
                    fy += (Math.random() - 0.5) * this.settings.driftSpeed;

                    const distToCenter = Math.sqrt(node.x * node.x + node.y * node.y);
                    if (distToCenter > 10) {
                        fx -= node.x * this.globalGravity * 0.001;
                        fy -= node.y * this.globalGravity * 0.001;
                    }

                    this.nodes.forEach(other => {
                        if (other === node) return;

                        const dx = node.x - other.x;
                        const dy = node.y - other.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) + 0.01;

                        if (dist < 100) {
                            const force = this.settings.repulsionStrength / (dist * dist);
                            fx += (dx / dist) * force * 0.001;
                            fy += (dy / dist) * force * 0.001;
                        }
                    });

                    this.edges.forEach(edge => {
                        let other = null;
                        if (edge.source === node) other = edge.target;
                        if (edge.target === node) other = edge.source;

                        if (other) {
                            const dx = other.x - node.x;
                            const dy = other.y - node.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist > 50) {
                                const force = edge.strength * this.settings.connectionAttraction;
                                fx += (dx / dist) * force;
                                fy += (dy / dist) * force;
                            }
                        }
                    });

                    node.vx = (node.vx + fx * dt) * this.settings.damping;
                    node.vy = (node.vy + fy * dt) * this.settings.damping;
                    node.vz = (node.vz + fz * dt) * this.settings.damping;

                    node.x += node.vx * dt;
                    node.y += node.vy * dt;
                    node.z += node.vz * dt;

                    const maxDist = 2000;
                    if (Math.abs(node.x) > maxDist) node.x = Math.sign(node.x) * maxDist;
                    if (Math.abs(node.y) > maxDist) node.y = Math.sign(node.y) * maxDist;

                    node.heat = Math.max(0, node.heat - 0.01);
                    node.pulse = Math.max(0, node.pulse - 0.02);

                    // Update search alpha
                    node.searchAlpha += (node.targetSearchAlpha - node.searchAlpha) * 0.1;

                    // Twinkle effect
                    node.twinkle += 0.01;
                });
            }

            renderBackgroundStars() {
                const ctx = this.ctx;

                // Draw distant stars with parallax
                this.backgroundStars.forEach(star => {
                    const parallax = 0.3;
                    const x = star.x - this.camera.x * parallax;
                    const y = star.y - this.camera.y * parallax;

                    const screenX = x * this.camera.zoom + this.canvas.width / 2;
                    const screenY = y * this.camera.zoom + this.canvas.height / 2;

                    if (screenX > -10 && screenX < this.canvas.width + 10 &&
                        screenY > -10 && screenY < this.canvas.height + 10) {

                        const twinkle = Math.sin(this.frame * 0.01 + star.x) * 0.2 + 0.8;
                        ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * twinkle})`;
                        ctx.fillRect(screenX, screenY, star.size, star.size);
                    }
                });
            }

            render() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear with very subtle fade for motion trails
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, width, height);

                ctx.save();

                // Render background stars first
                this.renderBackgroundStars();

                ctx.translate(width / 2, height / 2);
                ctx.scale(this.camera.zoom, this.camera.zoom);
                ctx.translate(-this.camera.x, -this.camera.y);

                // Draw connections with improved visibility
                this.edges.forEach(edge => {
                    const strength = edge.strength;
                    const searchDim = this.searchMode &&
                        edge.source.targetSearchAlpha < 0.5 &&
                        edge.target.targetSearchAlpha < 0.5;

                    const alpha = searchDim ? strength * 0.1 : strength * 0.4;

                    // Create gradient along the connection
                    const gradient = ctx.createLinearGradient(
                        edge.source.x, edge.source.y,
                        edge.target.x, edge.target.y
                    );

                    const baseAlpha = alpha * edge.source.searchAlpha * edge.target.searchAlpha;
                    gradient.addColorStop(0, `rgba(150, 180, 255, ${baseAlpha * 0.8})`);
                    gradient.addColorStop(0.5, `rgba(100, 150, 255, ${baseAlpha * 0.5})`);
                    gradient.addColorStop(1, `rgba(150, 180, 255, ${baseAlpha * 0.8})`);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = Math.max(0.5, strength * 2);
                    ctx.beginPath();
                    ctx.moveTo(edge.source.x, edge.source.y);

                    // Different curves for different connection types
                    const connectionType = edge.types ? edge.types[0] : 'default';
                    let cx, cy;

                    if (connectionType === 'temporal') {
                        // Straight line for temporal connections
                        ctx.lineTo(edge.target.x, edge.target.y);
                    } else {
                        // Curved for other types
                        cx = (edge.source.x + edge.target.x) / 2;
                        cy = (edge.source.y + edge.target.y) / 2 - 20;
                        ctx.quadraticCurveTo(cx, cy, edge.target.x, edge.target.y);
                    }

                    ctx.stroke();
                });

                // Draw nodes as stars
                const sortedNodes = Array.from(this.nodes.values())
                    .sort((a, b) => a.z - b.z);

                sortedNodes.forEach(node => {
                    const temp = this.getNodeTemperature(node);
                    const age = node.age || 0;
                    const ageAlpha = Math.max(0.3, 1 - age / 365) * node.searchAlpha;
                    const depthScale = 1 + node.z / 1000;
                    const radius = node.radius * depthScale;

                    // Color based on temperature
                    const starColors = {
                        hot: { r: 200, g: 220, b: 255 },    // Blue-white
                        warm: { r: 255, g: 255, b: 240 },   // Yellow-white
                        cool: { r: 255, g: 240, b: 200 },   // Orange-white
                        cold: { r: 255, g: 200, b: 150 }    // Red-white
                    };

                    const color = starColors[temp];

                    // Outer glow (large, faint)
                    if (node.heat > 0 || node === this.hoveredNode || node.targetSearchAlpha > 0.9) {
                        const glowRadius = radius * (4 + node.pulse);
                        const gradient = ctx.createRadialGradient(
                            node.x, node.y, 0,
                            node.x, node.y, glowRadius
                        );
                        gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.3 * ageAlpha})`);
                        gradient.addColorStop(0.3, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.1 * ageAlpha})`);
                        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(node.x, node.y, glowRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Corona (medium glow)
                    const coronaRadius = radius * 2;
                    const corona = ctx.createRadialGradient(
                        node.x, node.y, 0,
                        node.x, node.y, coronaRadius
                    );
                    corona.addColorStop(0, `rgba(255, 255, 255, ${0.9 * ageAlpha})`);
                    corona.addColorStop(0.2, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.6 * ageAlpha})`);
                    corona.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.fillStyle = corona;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, coronaRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // Core (bright center point)
                    const twinkle = Math.sin(node.twinkle * 3) * 0.2 + 0.8;
                    ctx.fillStyle = `rgba(255, 255, 255, ${ageAlpha * twinkle})`;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Label for hovered node
                    if (node === this.hoveredNode) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${ageAlpha * 0.8})`;
                        ctx.font = '12px Monaco';
                        ctx.fillText(node.id, node.x + radius + 5, node.y);
                    }
                });

                ctx.restore();

                // Breathing indicator (subtle)
                const breathAlpha = 0.2 + Math.sin(this.breathingPhase) * 0.1;
                ctx.fillStyle = `rgba(150, 180, 255, ${breathAlpha})`;
                ctx.fillRect(10, 10, 2, 2);
            }

            animate() {
                this.frame++;

                if (this.frame % 2 === 0) {
                    this.updatePhysics();
                }

                this.camera.x += (this.targetCamera.x - this.camera.x) * 0.1;
                this.camera.y += (this.targetCamera.y - this.camera.y) * 0.1;
                this.camera.zoom += (this.targetCamera.zoom - this.camera.zoom) * 0.1;

                this.render();

                requestAnimationFrame(() => this.animate());
            }

            highlightSearchResults(results) {
                // Dim all nodes
                this.nodes.forEach(node => {
                    node.targetSearchAlpha = 0.1;
                });

                // Highlight matching nodes
                results.forEach(result => {
                    const node = Array.from(this.nodes.values())
                        .find(n => n.id === result.path || n.path === result.path);

                    if (node) {
                        node.targetSearchAlpha = 1.0;
                        node.pulse = 0.5;

                        // Also highlight connected nodes slightly
                        this.edges.forEach(edge => {
                            if (edge.source === node) {
                                edge.target.targetSearchAlpha = Math.max(0.5, edge.target.targetSearchAlpha);
                            } else if (edge.target === node) {
                                edge.source.targetSearchAlpha = Math.max(0.5, edge.source.targetSearchAlpha);
                            }
                        });
                    }
                });
            }

            clearSearchHighlight() {
                this.nodes.forEach(node => {
                    node.targetSearchAlpha = 1.0;
                });
                this.searchMode = false;
            }

            // Event handlers
            onKeyDown(e) {
                if (e.key === '/' && !this.searchMode) {
                    e.preventDefault();
                    window.searchInterface.show();
                } else if (e.key === 'Escape' && this.searchMode) {
                    window.searchInterface.hide();
                }
            }

            onMouseDown(e) {
                if (!this.firstInteraction) {
                    this.firstInteraction = true;
                    document.getElementById('help-hint').style.opacity = '0';
                }

                this.mouse.down = true;
                this.mouse.lastX = e.clientX;
                this.mouse.lastY = e.clientY;
                this.mouse.startX = e.clientX;
                this.mouse.startY = e.clientY;

                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                const clickedNode = this.getNodeAt(worldPos.x, worldPos.y);

                if (clickedNode) {
                    this.selectedNode = clickedNode;
                    clickedNode.heat = 1;
                    clickedNode.pulse = 1;

                    if (e.shiftKey) {
                        this.draggedNode = clickedNode;
                    }
                } else {
                    this.clickedEmpty = true;
                    this.clickedEmptyPos = { x: e.clientX, y: e.clientY, world: worldPos };
                }
            }

            onMouseMove(e) {
                this.mouse.x = e.clientX;
                this.mouse.y = e.clientY;

                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                this.hoveredNode = this.getNodeAt(worldPos.x, worldPos.y);

                if (this.hoveredNode) {
                    this.canvas.classList.add('over-node');
                    this.canvas.style.cursor = 'pointer';
                } else {
                    this.canvas.classList.remove('over-node');
                    this.canvas.style.cursor = 'crosshair';
                }

                if (this.mouse.down) {
                    if (this.draggedNode) {
                        this.draggedNode.x = worldPos.x;
                        this.draggedNode.y = worldPos.y;
                        this.draggedNode.vx = 0;
                        this.draggedNode.vy = 0;
                    } else if (!this.selectedNode) {
                        const dx = e.clientX - this.mouse.lastX;
                        const dy = e.clientY - this.mouse.lastY;

                        this.targetCamera.x -= dx / this.camera.zoom;
                        this.targetCamera.y -= dy / this.camera.zoom;

                        this.mouse.lastX = e.clientX;
                        this.mouse.lastY = e.clientY;
                    }
                }
            }

            onMouseUp(e) {
                const dx = Math.abs(e.clientX - this.mouse.startX);
                const dy = Math.abs(e.clientY - this.mouse.startY);
                const wasClick = dx < 5 && dy < 5;

                if (wasClick && e.button === 0) {
                    if (this.selectedNode && !this.draggedNode) {
                        window.fileViewer.show(this.selectedNode);
                    } else if (this.clickedEmpty) {
                        const worldPos = this.screenToWorld(e.clientX, e.clientY);
                        window.brainInput.showAtPosition(e.clientX, e.clientY, worldPos);
                    }
                }

                this.mouse.down = false;
                this.selectedNode = null;
                this.draggedNode = null;
                this.clickedEmpty = false;
                this.clickedEmptyPos = null;
            }

            onDoubleClick(e) {
                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                const node = this.getNodeAt(worldPos.x, worldPos.y);

                if (node) {
                    window.fileViewer.show(node);
                }
            }

            onRightClick(e) {
                e.preventDefault();
                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                const node = this.getNodeAt(worldPos.x, worldPos.y);

                if (node) {
                    window.contextMenu.show(e.clientX, e.clientY, node);
                } else {
                    window.backgroundContextMenu.show(e.clientX, e.clientY, worldPos);
                }
            }

            onWheel(e) {
                e.preventDefault();
                const delta = e.deltaY * -0.001;
                this.targetCamera.zoom = Math.max(0.1, Math.min(3, this.targetCamera.zoom + delta));
            }

            onTouchStart(e) {
                if (e.touches.length === 1) {
                    this.onMouseDown(e.touches[0]);
                }
            }

            onTouchMove(e) {
                if (e.touches.length === 1) {
                    this.onMouseMove(e.touches[0]);
                }
            }

            onTouchEnd(e) {
                this.onMouseUp(e);
            }

            screenToWorld(x, y) {
                return {
                    x: (x - this.canvas.width / 2) / this.camera.zoom + this.camera.x,
                    y: (y - this.canvas.height / 2) / this.camera.zoom + this.camera.y
                };
            }

            getNodeAt(x, y) {
                let closest = null;
                let minDist = Infinity;

                this.nodes.forEach(node => {
                    const dx = node.x - x;
                    const dy = node.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < node.radius + 5 && dist < minDist) {
                        minDist = dist;
                        closest = node;
                    }
                });

                return closest;
            }

            focusNode(nodeId) {
                const node = this.nodes.get(nodeId);
                if (node) {
                    this.targetCamera.x = node.x;
                    this.targetCamera.y = node.y;
                    this.targetCamera.zoom = 1.5;
                    node.heat = 1;
                    node.pulse = 1;
                }
            }
        }

        // ============================================
        // SEARCH INTERFACE
        // ============================================

        class SearchInterface {
            constructor(galaxy) {
                this.galaxy = galaxy;
                this.searchBox = document.getElementById('search-box');
                this.searchInput = document.getElementById('search-input');
                this.resultsList = document.getElementById('search-results-list');
                this.results = [];
                this.selectedIndex = -1;
                this.searchDebounce = null;

                this.setupEvents();
            }

            setupEvents() {
                this.searchInput.addEventListener('input', (e) => {
                    clearTimeout(this.searchDebounce);
                    this.searchDebounce = setTimeout(() => {
                        this.search(e.target.value);
                    }, 200);
                });

                this.searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.selectNext();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.selectPrevious();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        this.openSelected();
                    } else if (e.key === 'Escape') {
                        this.hide();
                    }
                });
            }

            show() {
                this.searchBox.style.display = 'block';
                this.searchInput.value = '';
                this.searchInput.focus();
                this.galaxy.searchMode = true;
            }

            hide() {
                this.searchBox.style.display = 'none';
                this.searchInput.value = '';
                this.resultsList.style.display = 'none';
                this.results = [];
                this.selectedIndex = -1;
                this.galaxy.clearSearchHighlight();
            }

            async search(query) {
                if (!query) {
                    this.resultsList.style.display = 'none';
                    this.results = [];
                    this.galaxy.clearSearchHighlight();
                    return;
                }

                try {
                    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await response.json();

                    this.results = data.results;
                    this.displayResults();
                    this.galaxy.highlightSearchResults(this.results);
                } catch (error) {
                    console.error('Search failed:', error);
                }
            }

            displayResults() {
                if (this.results.length === 0) {
                    this.resultsList.innerHTML = '<div style="padding: 8px; color: rgba(150, 150, 200, 0.5);">No results found</div>';
                    this.resultsList.style.display = 'block';
                    return;
                }

                this.resultsList.innerHTML = this.results.map((result, index) => `
                    <div class="search-result-item ${index === this.selectedIndex ? 'selected' : ''}"
                         data-index="${index}">
                        <div class="filename">${result.path}</div>
                        <div class="match">${this.escapeHtml(result.match)}</div>
                    </div>
                `).join('');

                this.resultsList.style.display = 'block';

                // Add click handlers
                this.resultsList.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        this.selectedIndex = parseInt(item.dataset.index);
                        this.openSelected();
                    });
                });
            }

            selectNext() {
                if (this.results.length === 0) return;
                this.selectedIndex = (this.selectedIndex + 1) % this.results.length;
                this.updateSelection();
            }

            selectPrevious() {
                if (this.results.length === 0) return;
                this.selectedIndex = this.selectedIndex <= 0 ? this.results.length - 1 : this.selectedIndex - 1;
                this.updateSelection();
            }

            updateSelection() {
                const items = this.resultsList.querySelectorAll('.search-result-item');
                items.forEach((item, index) => {
                    if (index === this.selectedIndex) {
                        item.classList.add('selected');
                        item.scrollIntoView({ block: 'nearest' });
                    } else {
                        item.classList.remove('selected');
                    }
                });

                // Focus on the selected node in galaxy
                if (this.selectedIndex >= 0 && this.selectedIndex < this.results.length) {
                    const result = this.results[this.selectedIndex];
                    this.galaxy.focusNode(result.path);
                }
            }

            openSelected() {
                if (this.selectedIndex >= 0 && this.selectedIndex < this.results.length) {
                    const result = this.results[this.selectedIndex];
                    const node = Array.from(this.galaxy.nodes.values())
                        .find(n => n.id === result.path || n.path === result.path);

                    if (node) {
                        window.fileViewer.show(node);
                        this.hide();
                    }
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // ============================================
        // INLINE INPUT HANDLER
        // ============================================

        class InlineInput {
            constructor() {
                this.element = document.getElementById('inline-input');
                this.textarea = this.element.querySelector('textarea');
                this.worldPosition = null;

                this.setupEvents();
            }

            setupEvents() {
                this.textarea.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.ctrlKey) {
                        e.preventDefault();
                        this.save();
                    } else if (e.key === 'Escape') {
                        this.hide();
                    }
                });

                this.textarea.addEventListener('input', () => {
                    this.textarea.style.height = 'auto';
                    this.textarea.style.height = Math.min(200, this.textarea.scrollHeight) + 'px';
                });

                document.addEventListener('mousedown', (e) => {
                    if (this.element.style.display === 'block' &&
                        !this.element.contains(e.target)) {
                        this.hide();
                    }
                });
            }

            showAtPosition(x, y, worldPos) {
                this.worldPosition = worldPos;

                const rect = this.element.getBoundingClientRect();
                const maxX = window.innerWidth - 350;
                const maxY = window.innerHeight - 150;

                this.element.style.left = Math.min(x - 150, maxX) + 'px';
                this.element.style.top = Math.min(y - 30, maxY) + 'px';
                this.element.style.display = 'block';

                this.textarea.value = '';
                this.textarea.focus();
                this.textarea.style.height = '60px';
            }

            hide() {
                this.element.style.display = 'none';
                this.textarea.value = '';
            }

            async save() {
                const content = this.textarea.value.trim();
                if (!content) return;

                try {
                    const response = await fetch('/api/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content })
                    });

                    const result = await response.json();
                    if (result.success) {
                        document.getElementById('last-action').textContent = result.message;
                        this.hide();

                        if (this.worldPosition && window.galaxy) {
                            window.galaxy.createRipple(this.worldPosition.x, this.worldPosition.y);
                        }

                        if (window.galaxy) {
                            setTimeout(() => window.galaxy.loadGraph(), 500);
                        }
                    } else {
                        document.getElementById('last-action').textContent = 'Error: ' + result.error;
                    }
                } catch (error) {
                    document.getElementById('last-action').textContent = 'Error: ' + error.message;
                }
            }
        }

        // ============================================
        // FILE VIEWER
        // ============================================

        class FileViewer {
            constructor() {
                this.element = document.getElementById('file-viewer');
                this.titleElement = this.element.querySelector('.title');
                this.contentElement = this.element.querySelector('.content');
                this.closeButton = this.element.querySelector('.close');
                this.currentNode = null;

                this.setupEvents();
            }

            setupEvents() {
                this.closeButton.addEventListener('click', () => this.hide());

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && this.element.style.display === 'block') {
                        this.hide();
                    }
                });
            }

            async show(node) {
                this.currentNode = node;
                this.titleElement.textContent = node.id;

                try {
                    const response = await fetch(`/api/file/${encodeURIComponent(node.id)}`);
                    const data = await response.json();

                    this.contentElement.textContent = data.content;
                    this.element.style.display = 'block';

                    node.heat = 0.5;
                } catch (error) {
                    this.contentElement.textContent = 'Error loading file: ' + error.message;
                    this.element.style.display = 'block';
                }
            }

            hide() {
                this.element.style.display = 'none';
                this.currentNode = null;
            }
        }

        // ============================================
        // CONTEXT MENU
        // ============================================

        class ContextMenu {
            constructor() {
                this.element = document.getElementById('context-menu');
                this.currentNode = null;

                this.setupEvents();
            }

            setupEvents() {
                document.addEventListener('mousedown', (e) => {
                    if (!this.element.contains(e.target)) {
                        this.hide();
                    }
                });

                this.element.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const action = e.target.dataset.action;
                        this.handleAction(action);
                        this.hide();
                    });
                });
            }

            show(x, y, node) {
                this.currentNode = node;

                const maxX = window.innerWidth - 200;
                const maxY = window.innerHeight - 150;

                this.element.style.left = Math.min(x, maxX) + 'px';
                this.element.style.top = Math.min(y, maxY) + 'px';
                this.element.style.display = 'block';
            }

            hide() {
                this.element.style.display = 'none';
                this.currentNode = null;
            }

            handleAction(action) {
                if (!this.currentNode) return;

                switch (action) {
                    case 'open':
                        window.fileViewer.show(this.currentNode);
                        break;
                    case 'append':
                        this.appendToNode();
                        break;
                    case 'delete':
                        this.deleteNode();
                        break;
                }
            }

            appendToNode() {
                const content = prompt('Add to this thought:');
                if (!content) return;

                fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        filename: this.currentNode.id
                    })
                }).then(response => response.json())
                  .then(result => {
                      if (result.success) {
                          document.getElementById('last-action').textContent = result.message;
                          window.galaxy.loadGraph();
                      }
                  });
            }

            deleteNode() {
                if (!confirm(`Delete "${this.currentNode.id}"?`)) return;
                console.log('Delete not yet implemented');
            }
        }

        // ============================================
        // BACKGROUND CONTEXT MENU
        // ============================================

        class BackgroundContextMenu {
            constructor() {
                this.element = document.getElementById('background-context-menu');
                this.worldPosition = null;

                this.setupEvents();
            }

            setupEvents() {
                document.addEventListener('mousedown', (e) => {
                    if (!this.element.contains(e.target)) {
                        this.hide();
                    }
                });

                this.element.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const action = e.target.dataset.action;
                        this.handleAction(action);
                        this.hide();
                    });
                });
            }

            show(x, y, worldPos) {
                this.worldPosition = worldPos;

                const maxX = window.innerWidth - 200;
                const maxY = window.innerHeight - 100;

                this.element.style.left = Math.min(x, maxX) + 'px';
                this.element.style.top = Math.min(y, maxY) + 'px';
                this.element.style.display = 'block';
            }

            hide() {
                this.element.style.display = 'none';
                this.worldPosition = null;
            }

            handleAction(action) {
                switch (action) {
                    case 'new-thought':
                        if (this.worldPosition) {
                            // Show input at the click position
                            const x = parseFloat(this.element.style.left);
                            const y = parseFloat(this.element.style.top);
                            window.brainInput.showAtPosition(x, y, this.worldPosition);
                        }
                        break;
                    case 'search':
                        window.searchInterface.show();
                        break;
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        window.addEventListener('DOMContentLoaded', () => {
            window.galaxy = new GalaxyBrain(document.getElementById('galaxy-canvas'));
            window.searchInterface = new SearchInterface(window.galaxy);
            window.brainInput = new InlineInput();
            window.fileViewer = new FileViewer();
            window.contextMenu = new ContextMenu();
            window.backgroundContextMenu = new BackgroundContextMenu();

            setTimeout(() => {
                if (!window.galaxy.firstInteraction) {
                    document.getElementById('help-hint').style.opacity = '0';
                }
            }, 10000);
        });
    </script>
