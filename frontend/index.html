<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>headspace</title>
    <meta name="description" content="A diegetic semantic canvas for your document territory">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside id="territoryPanel">
            <div id="territoryHeader">
                <span class="territory-title">Territory</span>
                <div class="territory-actions">
                    <button id="finalizeBtn" title="Finalize clusters" hidden>Finalize</button>
                    <button id="ingestBtn" title="Ingest directory">+</button>
                </div>
            </div>
            <div id="territoryTree"></div>
        </aside>

        <main id="spaceMain">
            <canvas id="spaceCanvas"></canvas>
            <div id="ambientStatus"></div>

            <div id="lassoBar" hidden>
                <span id="lassoCount">0 selected</span>
                <button id="lassoApprove">Approve all</button>
                <button id="lassoReject">Reject all</button>
                <button id="lassoClear">Clear</button>
            </div>

            <div id="searchOverlay" hidden>
                <input id="searchInput" placeholder="Search your space..." autocomplete="off">
                <div id="searchFilters"></div>
                <div id="searchResults"></div>
            </div>
        </main>

        <aside id="cardPanel" hidden>
            <button id="cardClose" title="Close">×</button>
            <div class="card-content-zone" id="cardContentZone"></div>
            <div class="card-divider"></div>
            <div class="card-ai-zone" id="cardAiZone"></div>
            <div class="card-divider card-divider-note"></div>
            <div class="card-note-zone">
                <textarea id="cardNote" placeholder="What do you know about this that the system doesn't?"></textarea>
                <button id="enrichBtn" hidden>Enrich with context ?</button>
            </div>
            <div class="card-actions" id="cardActions"></div>
        </aside>
    </div>

    <div class="modal-overlay" id="ingestModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Ingest Directory</h3>
                <button class="close-btn" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <label for="ingestPath">Directory Path</label>
                <input type="text" id="ingestPath" placeholder="C:\\Users\\you\\Documents\\project" autocomplete="off">
                <p class="hint">Enter the full path to scan and project into space.</p>
            </div>
            <div class="modal-footer">
                <button id="cancelIngest">Cancel</button>
                <button id="confirmIngest">Start Ingestion</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>
    <div id="warningBanner" hidden></div>

    <script src="app.shared.js"></script>
    <script src="app.canvas.js"></script>
    <script src="app.js"></script>
</body>
</html>
