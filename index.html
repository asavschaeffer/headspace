<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Headspace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }

        #canvas-container.grabbing {
            cursor: grabbing;
        }

        #canvas-container.pointer {
            cursor: pointer;
        }

        #drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 300px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            pointer-events: all;
            z-index: 10;
            display: none;
        }

        @media (max-width: 768px) {
            #drop-zone {
                padding: 20px;
            }
        }

        #drop-zone.active {
            display: block;
        }

        #drop-zone.dragover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }

        #drop-zone h2 {
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: 500;
        }

        #drop-zone p {
            font-size: 0.9em;
            opacity: 0.7;
            line-height: 1.4;
        }

        #text-input {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        #text-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        #text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #node-tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 100;
            max-width: 300px;
            word-wrap: break-word;
        }

        #node-tooltip.visible {
            opacity: 1;
        }

        .add-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 50;
            font-size: 24px;
        }

        .add-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #loading {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 12px;
            display: none;
            z-index: 20;
        }

        #loading.visible {
            display: block;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 11px;
            opacity: 0.7;
            z-index: 15;
        }

        @media (max-width: 768px) {
            #controls {
                display: none; /* Hide on mobile to save space */
            }
        }

        #controls div {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="drop-zone">
            <h2>Add thought</h2>
            <p>Paste text or drag files to create nodes in your thoughtspace</p>
            <textarea id="text-input" placeholder="Type/paste text and press Enter"></textarea>
        </div>
        <div id="loading">Processing...</div>
        <div id="controls">
            <div>🖱️ Left click + drag: Rotate view</div>
            <div>🔍 Scroll: Zoom in/out</div>
            <div>📝 Click nodes to see content</div>
            <div>➕ Click + to add thoughts</div>
        </div>
        <div id="node-tooltip"></div>
        <div class="add-button">+</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="module">
        // Import transformers.js for embeddings
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

        class ThoughtSpace {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.nodes = [];
                this.embedder = null;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.hoveredNode = null;

                this.init();
                this.initEmbedder();
                this.setupEventListeners();
                this.animate();
            }

            init() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x000000, 0.00025);

                // Camera setup
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    10000
                );
                this.camera.position.set(0, 0, 100);

                // Renderer setup
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                // Controls with touch support
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.rotateSpeed = 0.5;
                this.controls.zoomSpeed = 0.8;

                // Touch settings for mobile
                this.controls.touches = {
                    ONE: THREE.TOUCH.ROTATE,
                    TWO: THREE.TOUCH.DOLLY_PAN
                };

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
                this.scene.add(ambientLight);

                const pointLight = new THREE.PointLight(0xffffff, 1);
                pointLight.position.set(50, 50, 50);
                this.scene.add(pointLight);

                // Create starfield
                this.createStarfield();

                // Create the mountain planet home node
                this.createMountainPlanet();

                // Window resize handler
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            createMountainPlanet() {
                // Create the main planet sphere
                const planetGeometry = new THREE.SphereGeometry(8, 32, 32);
                const planetMaterial = new THREE.MeshPhongMaterial({
                    color: 0x4a5568,  // Rocky gray color
                    emissive: 0x1a202c,
                    emissiveIntensity: 0.3,
                    shininess: 10
                });

                const planet = new THREE.Mesh(planetGeometry, planetMaterial);
                planet.position.set(-30, 0, -50); // Position it off to the side

                // Create mountain peak as a cone
                const peakGeometry = new THREE.ConeGeometry(3, 6, 8);
                const peakMaterial = new THREE.MeshPhongMaterial({
                    color: 0xffffff,  // White snow
                    emissive: 0xe0e0e0,
                    emissiveIntensity: 0.2
                });

                const peak = new THREE.Mesh(peakGeometry, peakMaterial);
                peak.position.set(-30, 11, -50); // Position on top of planet

                // Create snow cap gradient
                const snowCapGeometry = new THREE.ConeGeometry(3.5, 2, 8);
                const snowCapMaterial = new THREE.MeshPhongMaterial({
                    color: 0xf0f0f0,
                    emissive: 0xffffff,
                    emissiveIntensity: 0.1,
                    opacity: 0.9,
                    transparent: true
                });

                const snowCap = new THREE.Mesh(snowCapGeometry, snowCapMaterial);
                snowCap.position.set(-30, 9, -50);

                // Create atmospheric fog sphere around planet
                const atmosphereGeometry = new THREE.SphereGeometry(12, 32, 32);
                const atmosphereMaterial = new THREE.MeshBasicMaterial({
                    color: 0x88ccff,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.BackSide
                });

                const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
                atmosphere.position.set(-30, 0, -50);

                // Group all parts together
                const mountainPlanetGroup = new THREE.Group();
                mountainPlanetGroup.add(planet);
                mountainPlanetGroup.add(peak);
                mountainPlanetGroup.add(snowCap);
                mountainPlanetGroup.add(atmosphere);

                this.scene.add(mountainPlanetGroup);

                // Store reference for interaction
                this.mountainPlanet = {
                    group: mountainPlanetGroup,
                    planet: planet,
                    peak: peak,
                    link: 'asaschaeffer.com', // Change this to your desired URL
                    rotationSpeed: 0.001
                };

                // Add to nodes array for hover detection
                planet.userData = {
                    isHome: true,
                    text: 'Home - Click to explore',
                    preview: 'Home - Click to explore',
                    link: 'https://asaschaeffer.com' // Change this to your desired URL
                };
                this.nodes.push(planet);
            }

            createStarfield() {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const colors = [];
                const sizes = [];

                // Store individual star properties
                this.starData = [];
                const starCount = 5000;

                // Reduce star count on mobile for performance
                const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const actualStarCount = isMobileDevice ? 2000 : starCount;

                for (let i = 0; i < actualStarCount; i++) {
                    vertices.push(
                        (Math.random() - 0.5) * 2000,
                        (Math.random() - 0.5) * 2000,
                        (Math.random() - 0.5) * 2000
                    );

                    const color = new THREE.Color();
                    color.setHSL(Math.random() * 0.2 + 0.5, 0.5, Math.random() * 0.5 + 0.5);
                    colors.push(color.r, color.g, color.b);

                    const baseSize = 0.5 + Math.random() * 1.5;
                    sizes.push(baseSize);

                    // Each star gets its own twinkle properties
                    this.starData.push({
                        baseSize: baseSize,
                        twinkleSpeed: 0.05 + Math.random() * 0.15, // 5-20 second cycles
                        twinklePhase: Math.random() * Math.PI * 2,
                        twinkleOffset: Math.random() * 100, // Random time offset
                        baseOpacity: 0.1 + Math.random() * 0.2 // Vary base dimness
                    });
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

                // Store original colors for reference
                this.originalColors = new Float32Array(colors);

                const material = new THREE.PointsMaterial({
                    size: 1.5,
                    vertexColors: true,
                    sizeAttenuation: true,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    opacity: 0.8
                });

                this.stars = new THREE.Points(geometry, material);
                this.scene.add(this.stars);
            }

            async initEmbedder() {
                try {
                    console.log('Initializing embedder...');
                    document.getElementById('loading').classList.add('visible');

                    // Use feature-extraction pipeline for embeddings
                    this.embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

                    console.log('Embedder ready!');
                    document.getElementById('loading').classList.remove('visible');
                } catch (error) {
                    console.error('Failed to initialize embedder:', error);
                    // Fallback to random positioning if embedder fails
                    this.embedder = null;
                }
            }

            async createNode(text) {
                // Show loading
                document.getElementById('loading').classList.add('visible');

                let position;

                if (this.embedder) {
                    try {
                        // Generate embedding
                        const output = await this.embedder(text, { pooling: 'mean', normalize: true });
                        const embedding = Array.from(output.data);

                        // Simple projection to 3D using first 3 principal components
                        // In a real implementation, you'd use PCA or UMAP
                        position = this.projectTo3D(embedding);
                    } catch (error) {
                        console.error('Embedding failed:', error);
                        position = this.randomPosition();
                    }
                } else {
                    position = this.randomPosition();
                }

                // Create sphere geometry
                const geometry = new THREE.SphereGeometry(2, 32, 32);
                const color = new THREE.Color();
                color.setHSL(Math.random(), 0.7, 0.5);

                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    shininess: 100
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(position.x, position.y, position.z);

                // Store metadata
                sphere.userData = {
                    text: text,
                    id: Date.now(),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02
                    ),
                    originalColor: color.clone(),
                    preview: text.substring(0, 100) + (text.length > 100 ? '...' : '')
                };

                this.scene.add(sphere);
                this.nodes.push(sphere);

                // Hide input after adding node
                document.getElementById('drop-zone').classList.remove('active');
                document.getElementById('loading').classList.remove('visible');

                // Animate node appearance
                sphere.scale.set(0, 0, 0);
                this.animateNodeAppearance(sphere);
            }

            projectTo3D(embedding) {
                // Simple projection using first 3 dimensions scaled
                // In production, use proper dimensionality reduction
                const scale = 50;
                return {
                    x: (embedding[0] || 0) * scale,
                    y: (embedding[1] || 0) * scale,
                    z: (embedding[2] || 0) * scale
                };
            }

            randomPosition() {
                return {
                    x: (Math.random() - 0.5) * 100,
                    y: (Math.random() - 0.5) * 100,
                    z: (Math.random() - 0.5) * 100
                };
            }

            animateNodeAppearance(node) {
                const targetScale = 1;
                const duration = 1000;
                const start = Date.now();

                const animate = () => {
                    const elapsed = Date.now() - start;
                    const progress = Math.min(elapsed / duration, 1);

                    // Easing function
                    const easeOut = 1 - Math.pow(1 - progress, 3);

                    node.scale.set(easeOut * targetScale, easeOut * targetScale, easeOut * targetScale);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };

                animate();
            }

            setupEventListeners() {
                const dropZone = document.getElementById('drop-zone');
                const textInput = document.getElementById('text-input');
                const addButton = document.querySelector('.add-button');
                const tooltip = document.getElementById('node-tooltip');
                const container = document.getElementById('canvas-container');

                // Text input handler
                textInput.addEventListener('keypress', async (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        const text = textInput.value.trim();
                        if (text) {
                            await this.createNode(text);
                            textInput.value = '';
                        }
                    }
                });

                // Drag and drop handlers
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });

                dropZone.addEventListener('dragleave', (e) => {
                    dropZone.classList.remove('dragover');
                });

                dropZone.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');

                    const files = e.dataTransfer.files;
                    for (let file of files) {
                        if (file.type.startsWith('text/')) {
                            const text = await file.text();
                            await this.createNode(text.substring(0, 500)); // Limit text length
                        }
                    }
                });

                // Paste handler
                document.addEventListener('paste', async (e) => {
                    if (document.activeElement !== textInput) {
                        const text = e.clipboardData.getData('text');
                        if (text) {
                            await this.createNode(text.substring(0, 500));
                        }
                    }
                });

                // Detect if mobile
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                // Mouse/touch move for hover detection
                const handlePointerMove = (e) => {
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                    if (!clientX || !clientY) return;
                    this.mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                    // Update tooltip position (hide on mobile)
                    if (this.hoveredNode && !isMobile) {
                        tooltip.style.left = clientX + 15 + 'px';
                        tooltip.style.top = clientY - 30 + 'px';
                    }
                };

                document.addEventListener('mousemove', handlePointerMove);
                document.addEventListener('touchmove', handlePointerMove);

                // Click/tap handler for nodes
                const handlePointerClick = (e) => {
                    if (this.hoveredNode && !e.target.closest('#drop-zone') && !e.target.closest('.add-button')) {
                        // Check if it's the home planet
                        if (this.hoveredNode.userData.isHome && this.hoveredNode.userData.link) {
                            window.open(this.hoveredNode.userData.link, '_blank');
                            return;
                        }

                        // On mobile, show alert with text preview
                        if (isMobile) {
                            alert(this.hoveredNode.userData.preview);
                        } else {
                            console.log('Full text:', this.hoveredNode.userData.text);
                        }
                    }
                };

                document.addEventListener('click', handlePointerClick);
                document.addEventListener('touchend', handlePointerClick);

                // Add button click
                addButton.addEventListener('click', () => {
                    dropZone.classList.add('active');
                    textInput.value = '';
                    textInput.focus();
                });

                // Escape to close input
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Escape') {
                        dropZone.classList.remove('active');
                        textInput.blur();
                    }
                });

                // Mouse down/up for grab cursor
                this.renderer.domElement.addEventListener('mousedown', () => {
                    if (!this.hoveredNode) {
                        container.classList.add('grabbing');
                    }
                });

                document.addEventListener('mouseup', () => {
                    container.classList.remove('grabbing');
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Update controls
                this.controls.update();

                const time = Date.now() * 0.001;

                // Animate individual star twinkling
                if (this.stars && this.starData) {
                    const sizes = this.stars.geometry.attributes.size.array;
                    const colors = this.stars.geometry.attributes.color.array;

                    for (let i = 0; i < this.starData.length; i++) {
                        const star = this.starData[i];

                        // Each star has its own twinkle cycle
                        const wave = Math.sin(time * star.twinkleSpeed + star.twinklePhase + star.twinkleOffset);
                        // Sharp pulse effect - mostly dim, briefly bright
                        const twinkle = Math.pow(Math.max(0, wave), 4); // Even sharper with power of 4

                        // Update size - dramatic change when twinkling
                        sizes[i] = star.baseSize * (1 + twinkle * 3); // Up to 4x size when twinkling

                        // Update brightness through color
                        const brightness = star.baseOpacity + twinkle * (1 - star.baseOpacity);
                        const colorIndex = i * 3;
                        colors[colorIndex] = this.originalColors[colorIndex] * brightness;
                        colors[colorIndex + 1] = this.originalColors[colorIndex + 1] * brightness;
                        colors[colorIndex + 2] = this.originalColors[colorIndex + 2] * brightness;
                    }

                    this.stars.geometry.attributes.size.needsUpdate = true;
                    this.stars.geometry.attributes.color.needsUpdate = true;
                }

                // Animate mountain planet
                if (this.mountainPlanet) {
                    // Gentle rotation
                    this.mountainPlanet.group.rotation.y += this.mountainPlanet.rotationSpeed;

                    // Subtle floating motion
                    this.mountainPlanet.group.position.y = Math.sin(time * 0.3) * 0.5;
                }

                // Gentle drift for all nodes
                this.nodes.forEach(node => {
                    // Skip the home planet
                    if (node.userData.isHome) return;

                    // Sinusoidal drift
                    node.position.x += Math.sin(time + node.userData.id) * 0.01;
                    node.position.y += Math.cos(time * 0.7 + node.userData.id) * 0.01;
                    node.position.z += Math.sin(time * 0.5 + node.userData.id) * 0.01;

                    // Small rotation
                    node.rotation.y += 0.002;
                });

                // Check for hover
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.nodes);
                const container = document.getElementById('canvas-container');
                const tooltip = document.getElementById('node-tooltip');

                if (intersects.length > 0) {
                    const hoveredNode = intersects[0].object;

                    // Update cursor
                    container.classList.add('pointer');
                    container.classList.remove('grab');

                    if (this.hoveredNode !== hoveredNode) {
                        // Reset previous hover
                        if (this.hoveredNode) {
                            this.hoveredNode.material.emissiveIntensity = 0.2;
                            this.hoveredNode.scale.set(1, 1, 1);
                        }

                        this.hoveredNode = hoveredNode;

                        // Highlight hovered node
                        if (hoveredNode.userData.isHome) {
                            // Special highlight for mountain planet
                            hoveredNode.material.emissiveIntensity = 0.6;
                            this.mountainPlanet.group.scale.set(1.05, 1.05, 1.05);
                        } else {
                            hoveredNode.material.emissiveIntensity = 0.5;
                            hoveredNode.scale.set(1.1, 1.1, 1.1);
                        }

                        // Show tooltip
                        tooltip.textContent = hoveredNode.userData.preview;
                        tooltip.classList.add('visible');
                    }
                } else {
                    // Reset cursor
                    container.classList.remove('pointer');

                    if (this.hoveredNode) {
                        // Reset previous hover
                        if (this.hoveredNode.userData.isHome) {
                            this.hoveredNode.material.emissiveIntensity = 0.3;
                            this.mountainPlanet.group.scale.set(1, 1, 1);
                        } else {
                            this.hoveredNode.material.emissiveIntensity = 0.2;
                            this.hoveredNode.scale.set(1, 1, 1);
                        }
                        this.hoveredNode = null;

                        // Hide tooltip
                        tooltip.classList.remove('visible');
                    }
                }

                // Render
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize the application
        const thoughtSpace = new ThoughtSpace();

        // Show input on first load if no nodes
        document.getElementById('drop-zone').classList.add('active');
        document.getElementById('text-input').focus();
    </script>
</body>
</html>
